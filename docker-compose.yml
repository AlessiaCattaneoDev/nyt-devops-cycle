name: nyt-devops-cycle

# Ambiente locale: frontend servito da nginx (build statica) + BFF Express.
#   docker compose up --build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build   (hot reload)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nyt-devops/backend:local
    env_file:
      - .env
    environment:
      APP_ENV: development
      PORT: '3001'
      CORS_ORIGINS: 'http://localhost:8080,http://localhost:5173'
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: development
        VITE_DEBUG_ENDPOINTS: 'true'
    image: nyt-devops/frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'
    restart: unless-stopped
