name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ CI ---
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install (root)
        run: npm ci
      - name: Install (frontend)
        working-directory: frontend
        run: npm ci
      - name: Install (backend)
        working-directory: backend
        run: npm ci
      - name: Lint frontend (oxlint)
        working-directory: frontend
        run: npm run lint
      - name: Lint backend (oxlint)
        working-directory: backend
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc -b --noEmit

  test-proxy:
    name: Unit test (BFF proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: backend
        run: node --test "*.test.mjs"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  bundle-hygiene:
    name: Bundle hygiene (no leaked key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Assert no NYT key or API host in the bundle
        working-directory: frontend
        run: |
          if grep -rEn "api-key=|api\.nytimes\.com" dist; then
            echo "::error::Un segreto NYT o l'host API e' finito nel bundle del frontend"
            exit 1
          fi
          echo "bundle pulito: nessuna chiave/host NYT trovato in dist/"

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: nyt-devops/backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: nyt-devops/frontend:ci
          build-args: |
            VITE_APP_ENV=ci
            VITE_DEBUG_ENDPOINTS=false
      - name: Smoke test backend container
        run: |
          docker run -d --name bff -p 3001:3001 -e APP_ENV=ci nyt-devops/backend:ci
          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs bff
          test -n "$ok" || { echo "::error::il container backend non e' diventato healthy"; exit 1; }

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-proxy, secret-scan, bundle-hygiene, build-images]
    if: always()
    steps:
      - name: Fail se un job CI non e' verde
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Almeno un job CI non e' passato"
          exit 1
      - run: echo "Tutti i controlli CI sono verdi."

  # ------------------------------------------------------------------ CD ---
  # Il deploy e' gestito dall'integrazione Git di Vercel (progetto multi-service
  # definito in vercel.json):
  #   - push su main            -> deploy di Production
  #   - Pull Request verso main -> deploy di Preview (staging)
  # Vercel avvia la build solo dopo che questo workflow di CI e' verde
  # (Settings -> Git -> "Wait for CI before deploying" / Deployment protection).
  cd-info:
    name: CD (Vercel Git)
    runs-on: ubuntu-latest
    needs: [ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: |
          echo "CI verde: Vercel esegue il deploy di produzione da questo commit." >> "$GITHUB_STEP_SUMMARY"
